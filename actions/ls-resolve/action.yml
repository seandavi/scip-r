name: 'R languageserver symbol resolution'
description: >
  Runs R's languageserver against a package's R/ source to resolve call-site
  definitions, and writes the result as JSON. Intended to sit alongside an
  r-universe build/check step and feed a downstream SCIP-conversion job.
inputs:
  package-path:
    description: 'Path to the package root (has DESCRIPTION and R/)'
    required: true
    default: '.'
  positions-file:
    description: >
      Path to a JSON file listing call-site positions to resolve, produced
      by the tree-sitter pass (scip-r index --emit-positions). If omitted, the
      action derives positions itself via textDocument/documentSymbol only
      (definitions, no call resolution).
    required: false
    default: ''
  timeout-minutes:
    description: 'Hard timeout for the whole resolution pass'
    required: false
    default: '15'
  output-file:
    description: 'Where to write the resolved JSON'
    required: false
    default: 'ls-index.json'
runs:
  using: 'composite'
  steps:
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: 'release'
        use-public-rspm: true

    - name: Install languageserver + jsonlite + processx
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          any::languageserver
          any::jsonlite
          any::processx
        working-directory: ${{ inputs.package-path }}

    - name: Install package's own dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        extra-packages: any::pak
        needs: check
        working-directory: ${{ inputs.package-path }}

    - name: Run languageserver resolver
      shell: bash
      env:
        SCIP_R_PKG_PATH: ${{ inputs.package-path }}
        SCIP_R_POSITIONS_FILE: ${{ inputs.positions-file }}
        SCIP_R_OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        timeout ${{ inputs.timeout-minutes }}m \
          Rscript ${{ github.action_path }}/ls_index.R \
            --pkg "$SCIP_R_PKG_PATH" \
            --positions "$SCIP_R_POSITIONS_FILE" \
            --out "$SCIP_R_OUTPUT_FILE"

    - name: Upload resolved index
      uses: actions/upload-artifact@v7
      with:
        name: ls-index-${{ github.job }}
        path: ${{ inputs.output-file }}
        retention-days: 7
