[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scip-r"
version = "0.1.0"
description = "A static SCIP code-intelligence indexer for R packages (no R runtime required)"
requires-python = ">=3.9"
dependencies = [
    "tree-sitter>=0.23",
    "protobuf>=5",
]

[project.scripts]
scip-r = "scipr.cli:main"

[tool.setuptools]
packages = ["scipr"]
