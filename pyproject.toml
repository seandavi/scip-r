[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scip-r"
dynamic = ["version"]
description = "A static SCIP code-intelligence indexer for R packages (no R runtime required)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [{ name = "Sean Davis", email = "seandavi@gmail.com" }]
keywords = ["scip", "r", "code-intelligence", "tree-sitter", "static-analysis", "sourcegraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: R",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "tree-sitter>=0.23,<0.27",
    # tree-sitter-r has no PyPI release; see [tool.uv.sources] and README.
    "tree-sitter-r>=1.3.0",
    # scip_pb2.py was generated by protoc 35.x, which requires runtime >= 7.35.
    "protobuf>=7.35.1,<8",
    "typer>=0.15",
]

[project.optional-dependencies]
export = [
    "pyarrow>=17",
    "duckdb>=1.1",
]

[project.scripts]
scip-r = "scipr.cli:app"

[project.urls]
Homepage = "https://github.com/seandavi/scip-r"
Repository = "https://github.com/seandavi/scip-r"
Issues = "https://github.com/seandavi/scip-r/issues"
Changelog = "https://github.com/seandavi/scip-r/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-protobuf>=5",
    "pre-commit>=3.8",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
# r-lib/tree-sitter-r ships Python bindings in-tree but does not publish
# to PyPI. Pin to a tag so builds are reproducible.
tree-sitter-r = { git = "https://github.com/r-lib/tree-sitter-r", tag = "v1.3.0" }

[tool.hatch.version]
path = "src/scipr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scipr"]

[tool.hatch.build.targets.sdist]
include = [
    "src/scipr",
    "proto",
    "docs",
    "tests",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "export: tests that need the optional [export] extra (pyarrow, duckdb)",
    "r: tests that need Rscript with pkgload, codetools and jsonlite",
]

[tool.coverage.run]
source = ["scipr"]
omit = ["src/scipr/scip_pb2.py"]

[tool.ruff]
line-length = 99
target-version = "py310"
extend-exclude = ["src/scipr/scip_pb2.py", "src/scipr/scip_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["scipr"]

[tool.mypy]
python_version = "3.10"
packages = ["scipr"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
exclude = ["scip_pb2\\.py$"]

[[tool.mypy.overrides]]
module = ["tree_sitter_r", "duckdb", "pyarrow", "pyarrow.*", "scipr.scip_pb2"]
ignore_missing_imports = true
ignore_errors = true
