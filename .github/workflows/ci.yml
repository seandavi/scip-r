name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # Overrides the repo's .python-version so every uv command in this
      # job uses the matrix interpreter (otherwise `uv run` recreates .venv).
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - name: Sync (tree-sitter-r is compiled from its git tag here)
        run: uv sync --all-extras
      - run: uv run --no-sync pytest --cov=scipr --cov-report=xml
      - name: Smoke-test the CLI end to end
        run: |
          uv run --no-sync scip-r index tests/fixtures/testpkg -o index.scip --stats --emit-positions positions.json
          uv run --no-sync scip-r stats index.scip
          uv run --no-sync scip-r print index.scip --no-locals
          uv run --no-sync scip-r export index.scip --format parquet -o out-parquet
          uv run --no-sync scip-r export index.scip --format parquet --hive -o out-hive
          uv run --no-sync scip-r export index.scip --format duckdb -o index.duckdb
          tar czf testpkg.tar.gz -C tests/fixtures testpkg
          uv run --no-sync scip-r index testpkg.tar.gz -o tarball.scip --stats
          uv run --no-sync scip-r batch tests/fixtures/testpkg testpkg.tar.gz -o batch-out --jobs 2 --export parquet --hive
          test "$(wc -l < batch-out/summary.jsonl)" = "2"
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  resolve:
    name: R resolver (end to end)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
            any::codetools
            any::jsonlite
            any::R6
          working-directory: tests/fixtures/testpkg
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run --no-sync pytest -q -m r
      - name: Resolve the fixture package end to end
        run: |
          uv run --no-sync scip-r index tests/fixtures/testpkg -o index.scip --stats
          uv run --no-sync scip-r resolve index.scip --pkg tests/fixtures/testpkg --stats
          uv run --no-sync scip-r print index.resolved.scip --no-locals
          test "$(uv run --no-sync scip-r stats index.resolved.scip --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["guessed_external_symbols"])')" = "0"
          uv run --no-sync scip-r export index.resolved.scip --format duckdb -o index.duckdb
          python3 -c "import json; r = json.load(open('index.resolved.scip.meta.json')); print(r['run_id'], r['environment']['r_version'], r['source'])"
      - name: Resolve against an installed package (jsonlite) and batch with --resolve
        run: |
          uv run --no-sync scip-r resolve index.scip --installed jsonlite -o installed.scip --stats
          uv run --no-sync scip-r batch tests/fixtures/testpkg -o batch-r --resolve --export parquet --hive
          test "$(wc -l < batch-r/summary.jsonl)" = "1" && grep -q '"status": "ok"' batch-r/summary.jsonl

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Check the wheel installs and the entry point works
        run: |
          uv venv /tmp/venv
          # tree-sitter-r has no PyPI release; pre-install it from git
          uv pip install --python /tmp/venv "tree-sitter-r @ git+https://github.com/r-lib/tree-sitter-r@v1.3.0"
          uv pip install --python /tmp/venv dist/*.whl
          /tmp/venv/bin/scip-r --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
